services:
  db:
    image: postgres:16
    container_name: aivoa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-aivoa}
    ports:
      - "5432:5432"
    volumes:
      - aivoa_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aivoa"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aivoa_postgres_data:
